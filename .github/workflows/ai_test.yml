name: AI 连接测试

on:
  workflow_dispatch:
    inputs:
      provider:
        description: AI服务商
        required: true
        type: choice
        default: default
        options:
          - default
          - deepseek
          - kimi
          - qwen
          - openai
      model:
        description: 模型名称；留空使用服务商默认模型
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ai-connection-test
  cancel-in-progress: true

jobs:
  test-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 设置Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 安装最小依赖
        run: python -m pip install 'requests>=2.31,<3'

      - name: 运行AI连接测试
        env:
          TZ: Asia/Shanghai
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ inputs.provider != 'default' && inputs.provider || secrets.AI_PROVIDER || 'deepseek' }}
          AI_MODEL: ${{ inputs.model || secrets.AI_MODEL || '' }}
        run: python ai_test.py
