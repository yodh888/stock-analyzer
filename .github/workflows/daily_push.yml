name: 自选股每日分析推送

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 非交易日也强制执行
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stock-push
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 设置Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 校验必要密钥
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "::error::未配置 SERVERCHAN_KEY，无法执行定时推送"
            exit 1
          fi

      - name: 运行分析推送
        env:
          TZ: Asia/Shanghai
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_ENABLED: ${{ secrets.AI_ENABLED }}
        run: python daily_push.py
